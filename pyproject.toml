[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "unified-ui"
version = "0.1.0"
description = "A unified UI framework built on Flet"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["flet>=0.80.0"]

[tool.setuptools]
package-dir = {"unified_ui" = "unified_ui/scripts"}
packages = ["unified_ui"]

[tool.setuptools.package-data]
unified_ui = ["../themes/*.json"]